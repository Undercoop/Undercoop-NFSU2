; UNDERCOOP: NFSU2
; This file belongs to this game copy. Settings take effect on the next launch.
; Open Undercoop Settings in the launcher to change supported options.

[Network]
; 0 = automatic instance selection, 1 = Player 1 (Host), 2 = Player 2 (Client).
Instance = 0
; Your teammate's IPv4 address. Use 127.0.0.1 for two copies on one PC.
PeerAddress = 127.0.0.1
; Local UDP port, 1-64535. Gameplay also uses this port + 1000.
Port = 48930
; Your teammate's local UDP port. Use opposite ports for two local copies.
PeerPort = 48931

[GhostCar]
; Synchronize the other player's car: 0 = off, 1 = on. F9 toggles it in-game.
EnableSync = 1
; Legacy compatibility values; the current physical-car system does not use them.
LoopbackOffsetX = 4.0
LoopbackOffsetY = 0.0

[Experimental]
; Gameplay options: 0 = off, 1 = on. Both players must use matching choices.
; Include synchronized AI race opponents.
RaceAI = 1
; Share Free Roam traffic and ambient racers. Requires RaceAI = 1.
WorldFleet = 1

[Announcements]
; Automatically show the console: 0 = manual, 1 = invitations, 2 = all notices.
; Z opens or closes the console in any mode.
AutoShow = 1
; Console background opacity, 10-100 percent.
BackgroundOpacity = 70

[Career]
; Initial Host profile preference. Leave empty to let the game select a valid save.
; Resume remembers the last career successfully loaded. Client keeps its own save.
Profile = 
; Keep a restorable snapshot of each successful CO-OP career save.
AutoBackup = 1

[General]
; Legacy compatibility value; ignored. Open CO-OP explicitly from the main menu.
AutoStartCoop = 0
