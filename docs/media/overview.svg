<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
<title id="title">Two drivers. One shared career.</title><desc id="desc">Explore Bayview together, coordinate races and milestones, and keep your personal garage.</desc>
<rect x="0.5" y="0.5" width="1079" height="299" rx="18" fill="#101215" stroke="#2c3239"/>
<text x="32" y="44" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#a4aeb9" font-weight="600">BUILT AROUND THE WHOLE JOURNEY</text>
<text x="32" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="30" fill="#f2f4f7" font-weight="700">Shared milestones. Individual machines.</text>
<rect x="32" y="120" width="328" height="146" rx="14" fill="#191d23" stroke="#323941"/>
<text x="50" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#d7b878" font-weight="700">01</text>
<text x="50" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#f2f4f7" font-weight="700">EXPLORE</text>
<text x="50" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">Free Roam, discoveries,</text>
<text x="50" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">traffic and story moments.</text>
<rect x="376" y="120" width="328" height="146" rx="14" fill="#191d23" stroke="#323941"/>
<text x="394" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#d7b878" font-weight="700">02</text>
<text x="394" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#f2f4f7" font-weight="700">RACE</text>
<text x="394" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">Coordinated starts, results</text>
<text x="394" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">and multi-heat progression.</text>
<rect x="720" y="120" width="328" height="146" rx="14" fill="#191d23" stroke="#323941"/>
<text x="738" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#d7b878" font-weight="700">03</text>
<text x="738" y="181" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#f2f4f7" font-weight="700">KEEP YOUR IDENTITY</text>
<text x="738" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">Your car, money and parts.</text>
<text x="738" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#aeb8c4" font-weight="400">A career advanced together.</text>
</svg>